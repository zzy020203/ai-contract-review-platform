# Nginx 统一入口：前端静态资源 + 后端 API 反向代理（SSE 关闭缓冲）
# 生产开启 TLS 时，将 listen 80 改为 443 ssl 并补充证书配置（fullchain.pem / privkey.pem）
server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    # 前端静态资源（Vue Router history 模式回退 index.html）
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 后端 API（含 SSE 进度推送：关闭缓冲、长连接超时）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
