# 企业智能合同审查平台 — 全栈编排（生产私有化部署）
# 使用：cd deploy && cp .env.example .env（按需修改）&& docker compose up -d --build
# 入口：http://<host>:8080（前端）、http://<host>:9090（Prometheus）、http://<host>:3000（Grafana）

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg2://contract:contract@postgres:5432/contract
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
  STORAGE_DIR: /data/storage
  LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
  LLM_API_KEY: ${LLM_API_KEY:-sk-local}
  LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
  MILVUS_URI: http://milvus:19530
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:-contract-internal-token}
  DEBUG: "false"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: contract
      POSTGRES_USER: contract
      POSTGRES_PASSWORD: contract
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contract"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Milvus 依赖 etcd 与 minio
  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.4.9
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  # 一次性初始化：建表 + 预置角色/账号/规则（幂等）
  init-db:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.db_init"]
    environment: *backend-env
    volumes:
      - app_storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment: *backend-env
    volumes:
      - app_storage:/data/storage
    ports:
      - "8000:8000"
    depends_on:
      init-db:
        condition: service_completed_successfully

  celery-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--pool=solo", "-l", "info"]
    environment:
      <<: *backend-env
      INTERNAL_API_BASE: http://backend:8000
    volumes:
      - app_storage:/data/storage
    depends_on:
      init-db:
        condition: service_completed_successfully

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pg_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
  app_storage:
  prometheus_data:
  grafana_data:
